<style>
:root{--o:#f07d00;--g:#009640;--gd:#00702f;--ink:#1c2a22;--mu:#6b7a70;--ln:#dfe6e0;--bg:#f3f6f2;--P:#009640;--T:#f07d00;--F:#d63a3a;--R:#2f7fd1;--sc:#1c2b45;--sh:44px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
input,select{border:1px solid var(--ln);border-radius:8px;padding:10px 12px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
.btn{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block;white-space:nowrap}
.btn.pr{background:var(--g);border-color:var(--g);color:#fff}.btn.dg{background:var(--F);border-color:var(--F);color:#fff}button:focus-visible,a:focus-visible{outline:2px solid var(--o)}
#strip{position:sticky;top:0;z-index:20;height:var(--sh);display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#1c2b45,#2a3d5f);color:#fff;font-weight:800;font-size:15px;border-bottom:3px solid var(--o);text-align:center;padding:0 10px}
#app{display:flex;min-height:calc(100vh - var(--sh))}#mn{flex:1;min-width:0}
aside{width:224px;background:#1c2b45;position:sticky;top:var(--sh);height:calc(100vh - var(--sh));padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex:none;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;line-height:1.15;padding:2px 6px 16px;font-size:15px}.brand img{height:42px;background:#fff;border-radius:8px;padding:3px}
aside button{display:flex;align-items:center;gap:10px;border:0;background:none;color:#b8c4da;padding:11px 12px;border-radius:10px;font-weight:700;font-size:14px;text-align:left;cursor:pointer}
aside button:hover{background:#2a3d5f;color:#fff}aside button.on{background:var(--o);color:#fff}aside #out{margin-top:auto}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:var(--sh);z-index:5;box-shadow:0 2px 10px rgba(20,40,30,.06)}
.top h1{font-size:21px;font-weight:800;text-align:center;color:#1c2b45}.top .who{font-weight:700;font-size:14px}.top .who small{display:block;color:var(--mu);font-weight:600;font-size:12px}.top select{justify-self:end}
main{padding:18px 22px 60px;max-width:960px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(20,40,30,.06)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:#fff;border:1px solid var(--ln);border-top:4px solid var(--c,var(--g));border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(20,40,30,.06)}
.kp b{display:block;font-size:28px;font-weight:800;color:var(--c,var(--g))}.kp small{color:var(--mu);font-weight:600}
h3{font-size:16px;margin:6px 0 10px;color:#1c2b45}
table{width:100%;border-collapse:collapse}th{font-size:12px;font-weight:700;color:var(--gd);text-align:left;padding:10px;background:#eef6f0;border:1px solid var(--ln)}td{padding:10px;border:1px solid var(--ln);vertical-align:middle}.tw{overflow-x:auto}
.pill{border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px;color:#fff;background:var(--c)}.pill.n0{background:#e8ece9;color:var(--mu)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}
.msg{color:var(--mu);padding:26px 0;text-align:center}.mu{color:var(--mu)}
.lock{display:inline-block;background:#fff4e0;border:1px solid #f3d29b;color:#7a4a00;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;line-height:1.3}.lock small{display:block;font-weight:600;opacity:.85}
.prog{height:14px;background:#e6ece7;border-radius:8px;overflow:hidden;display:flex}.prog i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:600}.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.cal{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px;min-width:650px}.cal .hd{text-align:center;font-weight:800;font-size:15px;color:#fff;background:var(--sc);border-radius:8px;padding:9px 4px}
.cl{border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:#fff;min-height:88px;display:flex;flex-direction:column;font-size:11px}.cl.e{background:#f7f9f7}.cl.hoy{outline:2px solid var(--o)}
.cl .dn{background:#0b3d3a;color:#fff;text-align:center;font-weight:800;padding:3px;font-size:12px}
.cl .tm{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:800;text-transform:uppercase;padding:6px 4px;line-height:1.2}
.av{position:relative;display:inline-grid;place-items:center;width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:#dfe9e2;color:var(--gd);font-weight:800;font-size:calc(var(--s,40px)*.38);overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(20,40,30,.2)}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rhd{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-top:5px solid var(--o)}.rhd h2{font-size:22px;color:#1c2b45;margin:2px 0}
body.lgn{background:linear-gradient(160deg,#eaf5ee,#fdf1e1)}
#lg{max-width:390px;margin:8vh auto;padding:28px 26px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(28,43,69,.12);border-top:5px solid var(--o)}
#lg img{height:84px;margin-bottom:10px}#lg h1{font-size:22px;margin-bottom:4px;color:#1c2b45}#lg p{color:var(--mu);margin-bottom:18px;font-weight:600}
#lg form{display:flex;flex-direction:column;gap:12px;text-align:left}

.pw{position:relative;display:flex}.pw input{flex:1;padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:8px;color:var(--mu);display:flex}
#err{color:var(--F);font-weight:600;min-height:20px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(20,30,45,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.ov.on{display:flex}
.dlg{background:#fff;border-radius:16px;padding:26px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg .ico{width:56px;height:56px;border-radius:50%;background:#fff1de;color:var(--o);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.dlg .ico svg{width:28px;height:28px}
.dlg h2{font-size:19px;margin-bottom:6px;color:#1c2b45}.dlg p{color:var(--mu);margin-bottom:18px}.dlg .acts{display:flex;gap:10px;justify-content:center}

@media(max-width:800px){.top .who .wn{font-size:24px}}
.cl[data-dia]{cursor:pointer}.cl[data-dia]:hover{box-shadow:0 2px 10px rgba(0,0,0,.25)}

.nx .nl{font-size:13px;font-weight:800;color:var(--o);text-transform:uppercase;letter-spacing:.04em}
.nx .nf{font-size:24px;font-weight:800;color:#1c2b45;margin:4px 0 2px;line-height:1.2}
.nx .nw{display:inline-block;background:var(--o);color:#fff;border-radius:20px;padding:3px 12px;font-weight:800;font-size:13px;margin:4px 0 8px}
.nx .nt{font-weight:700;margin:2px 0}.nx .nt small{display:block;color:var(--mu);font-weight:600}
.nx .nm{margin-top:10px;padding:9px 12px;background:#fff4e0;border:1px solid #f3d29b;border-radius:10px;color:#7a4a00;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:20px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px;background:#fff}
.chip b{font-weight:800}
.ci{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-style:normal;font-weight:800;font-size:13px}
.ci.big{width:44px;height:44px;font-size:19px;margin:6px 0 4px}
.dcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.dc{position:relative;border:1.5px solid var(--ln);border-radius:14px;padding:14px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;background:#fff}
.dc small{font-size:11px;font-weight:700;color:var(--mu)}.dc b{font-size:15px;color:#1c2b45}
.dc.hoy{border:3px solid #2f7fd1;background:#eef4ff;box-shadow:0 0 0 3px rgba(47,127,209,.18)}
tr.rec td{background:#fff7d6}tr.rec td:first-child{box-shadow:inset 4px 0 0 #f0b400}
.dc .hb{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#2f7fd1;color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 8px}
